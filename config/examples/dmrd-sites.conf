# A sites file for dmrd -f: one section per site, naming the repeaters that make it up.
# This one is a Capacity Plus system of three sites with one repeater each, as the sites' rest channel
# announcements and neighbour lists describe them. A larger site lists several, e.g.
#   freq = "453m4250 460m1375"
#   lcn = "1 2"
# A channel no site lists is decoded as a site of its own (dmrd's -y and -c)
[SCMTD 1]
system = SCMTD
site = 1
type = capacity_plus
color-code = 0
freq = 453m4250
lcn = 1

[SCMTD 2]
system = SCMTD
site = 2
type = capacity_plus
color-code = 0
freq = 453m9750
lcn = 1

[SCMTD 3]
system = SCMTD
site = 3
type = capacity_plus
color-code = 0
freq = 460m6375
lcn = 1
