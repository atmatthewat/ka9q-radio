[DMR]
# DMR repeater outputs for dmrd: complex baseband (I/Q, I on the left), one SSRC per frequency.
# 19.2 kHz is four samples per 4800 baud symbol; with the default 20 ms block that's 384 samples per
# block. The filter passes the whole 12.5 kHz channel
# Give the I/Q its own group: monitor on a group carrying I/Q would play it as noise. dmrd sends its
# speech to another group (its -R)
data = dmr-iq.local
mode = iq
samprate = 19200
low = -6250
high = +6250
# The [iq] preset turns the linear demodulator's AGC on, and in I/Q mode it scales both I and Q.
# dmrd normalizes the level itself, so turn it off and use a fixed gain. Floats can't clip
encoding = f32le
agc = no
gain = 60
# Every repeater output to decode, e.g. the repeaters of a multi-site system: dmrd votes between
# those that carry the same call. They must all lie within the front end's coverage, and the front
# end gain should be fixed below its overload point (see docs/dmrd.md, "Front end gain")
freq = "453m4250 453m9750 460m1375 460m6375"
